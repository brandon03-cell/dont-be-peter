<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Don't be Peter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500&family=Press+Start+2P&family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/atomos.css">
  <link rel="stylesheet" href="css/moleculas.css">
  <link rel="stylesheet" href="css/organismos.css">
  <link rel="stylesheet" href="css/pantallas/welcome.css">
  <link rel="stylesheet" href="css/pantallas/menu.css">
  <link rel="stylesheet" href="css/pantallas/reparto.css">
  <link rel="stylesheet" href="css/pantallas/sala.css">
  <link rel="stylesheet" href="css/pantallas/gramola.css">
  <link rel="stylesheet" href="css/pantallas/tutorial.css">
  <link rel="stylesheet" href="css/pantallas/creditos.css">
  <link rel="stylesheet" href="css/pantallas/aviso.css">
</head>
<body>
  <main>
    <!-- ========== WELCOME (Manuel) ========== -->
    <section class="pantalla pantallaWelcome activa" id="pantallaWelcome">
    </section>

    <!-- ========== MENÚ (Brandon) ========== -->
    <section class="pantalla pantallaMenu" id="pantallaMenu">
    </section>

    <!-- ========== REPARTO (Alba) ========== -->
    <section class="pantalla pantallaReparto" id="pantallaReparto">
    </section>

    <!-- ========== SALA (Manuel) ========== -->
    <section class="pantalla pantallaSala" id="pantallaSala">
          <div class="sala">
        <div class="lado">
          <div class="hud">
            <h2 class="hudRonda" id="textoRonda">Ronda 1</h2>
            <p class="hudTexto" id="textoJugadores">4 jugadores · 3 sillas</p>
            <h3 class="hudEtiqueta">En juego</h3>
            <div class="chips" id="chipsJugadores"></div>
          </div>
          <div class="acciones">
            <button class="boton botonAmarillo botonAncho botonAlto" id="botonParar">Parar música</button>
            <button class="boton botonCrema botonAncho botonAlto" id="botonCambiarDisco">♪ Cambiar disco</button>
          </div>
        </div>
        <div class="escenario">
          <div class="escena" id="escena">
            <div class="escenaHud">
              <div class="contadorHud">
                <p class="contadorHudNombre">Ronda</p>
                <p class="contadorHudValor" id="hudRonda">1</p>
              </div>
              <p class="escenaBanner" id="textoBanner">¡A bailar!</p>
              <div class="escenaDerecha">
                <div class="contadorHud">
                  <p class="contadorHudNombre">Sillas</p>
                  <p class="contadorHudValor" id="hudSillas">3</p>
                </div>
                <div class="contadorHud">
                  <p class="contadorHudNombre">Tiempo</p>
                  <p class="contadorHudValor" id="hudTime">0</p>
                </div>
              </div>
            </div>
            <img class="mesa" src="img/iconos/mesa.svg" alt="">
            <img class="mesaBrillo" src="img/iconos/mesaBrillo.svg" alt="">
            <p class="mesaTexto" id="textoMesa">3 sillas<br>4 personas</p>
            <div class="sillas" id="sillas"></div>
            <p class="notaMusical notaMusical1">♪</p>
            <img class="iconoNota iconoNota1" src="img/iconos/nota.svg" alt="">
            <p class="notaMusical notaMusical2">♪</p>
            <img class="iconoNota iconoNota2" src="img/iconos/nota.svg" alt="">
            <p class="notaMusical notaMusical3">♫</p>
            <img class="iconoNota iconoNota3" src="img/iconos/nota.svg" alt="">
            <div class="corro" id="corro"></div>
            <div class="foco" id="foco"></div>
            <div class="marco"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ========== GRAMOLA (Diego) ========== -->
    <section class="pantalla pantallaGramola" id="pantallaGramola">
    </section>

    <!-- ========== TUTORIAL (Alba) ========== -->
    <section class="pantalla pantallaTutorial" id="pantallaTutorial">
    </section>

    <!-- ========== CRÉDITOS (Brandon) ========== -->
    <section class="pantalla pantallaCreditos" id="pantallaCreditos">
    </section>

    <!-- ========== AVISO Y FINAL (Diego) ========== -->
    <section class="pantalla pantallaAviso" id="pantallaAviso">
    </section>
  </main>

  <script src="js/comun.js"></script>
  <script src="js/juego.js"></script>
  <script src="js/welcome.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/reparto.js"></script>
  <script src="js/sala.js"></script>
  <script src="js/gramola.js"></script>
  <script src="js/tutorial.js"></script>
  <script src="js/creditos.js"></script>
  <script src="js/aviso.js"></script>
</body>
</html>
